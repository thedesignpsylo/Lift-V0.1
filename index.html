<body>
<div id="app">
  <main id="view"></main>
  <nav id="nav" aria-label="Main">
    <button data-tab="today" aria-label="Today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3" fill="currentColor"/></svg></button>
    <button data-tab="plan" aria-label="Plan"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
    <button data-tab="progress" aria-label="Progress"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 20V12M12 20V5M18 20v-5"/></svg></button>
  </nav>
  <section id="detail" class="detail" aria-modal="true" role="dialog"></section>
  <div id="toast"></div>
</div>
<div id="picker" role="dialog" aria-label="Choose profile"></div>
<div id="splash" class="on"><div class="sp-launch"><span>GO</span><span>LIFT</span><span>BIT**H!!</span></div></div>
<input type="file" id="importFile" accept="application/json" hidden>
